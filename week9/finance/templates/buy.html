{% extends "layout.html" %}

{% block title %}
    Buy
{% endblock %}

{% block main %}
    <form action="/buy" method="post">
        <!-- 1. Input for Stock Symbol -->
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="symbol" value="{{ symbol }}" placeholder="Symbol" type="text" required>
        </div>

        <!-- 2. Input for Number of Shares -->
        <div class="mb-3">
            <input class="form-control mx-auto w-auto" min="1" name="shares" placeholder="Shares" type="number" required>
        </div>

        <!-- Submit Button -->
        <button class="btn btn-primary" type="submit">Buy</button>
    </form>
{% endblock %}
