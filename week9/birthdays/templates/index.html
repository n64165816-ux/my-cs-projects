<!doctype html>

<html lang="en">

    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet" />
        <link href="/static/styles.css" rel="stylesheet" />
        <title>Birthdays</title>
    </head>

    <body>
        <div class="header">
            <h1>Birthdays</h1>
        </div>
        <div class="container">
            <div class="section">
                <h2>Add a Birthday</h2>
                <!-- TODO: Create a form for users to submit a name, a month, and a day -->
                <form action="/" method="POST">
                    <input name="name" autocomplete="off" placeholder="Name" type="text" required />
                    <input name="month" autocomplete="off" placeholder="Month" type="number" min="1" max="12" required />
                    <input name="day" autocomplete="off" placeholder="Day" type="number" min="1" max="31" / required>
                    <button type="submit">Add Birthady</button>
                </form>
            </div>

            <div class="section">
                <h2>All Birthdays</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Birthday</th>
                            <th>Delete</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- TODO: Loop through the database entries to display them in this table -->
                        {% for birthday in birthdays %}
                        <tr>
                            <td>{{ birthday.name }}</td>
                            <td>{{ birthday.month }}/{{ birthday.day}}</td>
                            <td>
                                <!-- Form to handle the deletion of this specific birthday entry -->
                                <form action="/delete" method="post" style="display: inline;">
                                    <input type="hidden" name="id" value="{{ birthday.id }}">
                                    <button type="submit" class="btn-delete">❌</button>
                                </form>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </body>

</html>
