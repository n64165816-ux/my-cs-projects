<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            // TODO: Add code to check answers to questions
            // For the MCQ:
            function checkCapital(content){
                const correctPlaceholder = document.getElementById("correctCapital")

                if (content.innerText != "Rabat"){
                    content.style.background = "red";
                    correctPlaceholder.innerText = "Incorrect";
                } else {content.style.background = "green";
                    correctPlaceholder.innerText = "Correct!!";
                }
            }
            // For the free reponse
            function checkDish(){
                const correctPlaceholder = document.getElementById("correctResponse");
                const freeResponseAnswer = document.getElementById("freeResponse");

                if (freeResponseAnswer.value != "tagine"){
                    correctPlaceholder.innerText = "Incorrect";
                    freeResponseAnswer.style.background ="red";
                } else {
                    correctPlaceholder.innerText = "Correct!!";
                    freeResponseAnswer.style.background ="green";

                }
            }
        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <!-- TODO: Add multiple choice question here -->
                 <h3>What is the capital of Morroco?</h3>
                 <p id="correctCapital"></p>
                 <!-- 'this' passes the clicked button element directly into the function -->
                 <button onclick="checkCapital(this)">Casa</button>
                 <button onclick="checkCapital(this)">Rabat</button>
                 <button onclick="checkCapital(this)">Agadir</button>
                 <button onclick="checkCapital(this)">Fes</button>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <!-- TODO: Add free response question here -->
                 <h3>What is the name of the traditional Moroccan dish often cooked in a conical clay pot?</h3>
                 <p id ="correctResponse"></p>
                 <!--
                    - The 'onsubmit' event catches both the button click AND the Enter key press.
                    - 'event.preventDefault()' stops the form from reloading the page, keeping the colors visible.-->
                 <form onsubmit="event.preventDefault(); checkSmart();">
                    <input type = "text" id ="freeResponse" placeholder="Type your answer...">
                    <button type="submit" onclick="checkDish()">Check Answer</button>
                 </form>
            </div>
        </div>
    </body>
</html>
